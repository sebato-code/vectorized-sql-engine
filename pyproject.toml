[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorized-sql-engine"
version = "0.1.0"
description = "Lightweight vectorized relational database engine in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
